#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Julian"
email = "julianorlich1@gmail.com"

[ui]
color = "auto"
editor = "nvim"

[revsets]
log = "::"

[colors]
# anyscheme for jj: light-background, high-contrast, not washed out.
# Based on dotfiles/nvim/colors/anyscheme.lua.

# Palette:
# fg          #000000
# teal_deep   #009393
# cyan_ink    #0074b1
# emerald     #008800
# aqua_dark   #008080
# olive_bold  #2A6500
# comment     #888888
# ui_gray     #666666  (darkened from nvim's #B0B0B0 for terminal readability)
# error       #8B0000
# warn        #664400
# diff_add    #9BE7A7
# diff_delete #F2A6A6
# diff_change #F2DEA0

# Diagnostics / command output
error = { fg = "#8B0000", bold = true }
error_source = "#000000"
"error heading" = { fg = "#8B0000", bold = true }
"error_source heading" = { fg = "#000000", bold = true }
warning = { fg = "#664400", bold = true }
"warning heading" = { fg = "#664400", bold = true }
hint = "#0074b1"
"hint heading" = { fg = "#0074b1", bold = true }

# IDs. jj splits short IDs into prefix/rest labels, so color those explicitly.
commit_id = "#0074b1"
change_id = "#009393"
"commit_id prefix" = { fg = "#000000", bold = true }
"commit_id rest" = "#0074b1"
"commit_id shortest prefix" = { fg = "#000000", bold = true }
"commit_id shortest rest" = "#0074b1"
"change_id prefix" = { fg = "#005F5F", bold = true }
"change_id rest" = "#009393"
"change_id shortest prefix" = { fg = "#005F5F", bold = true }
"change_id shortest rest" = "#009393"
prefix = { bold = true }
rest = "#666666"
change_offset = { fg = "#664400", bold = true }
"hidden prefix" = "#888888"

# Metadata
# Author/email are intentionally neutral, not warning-yellow.
author = "#666666"
"author email" = "#666666"
"author email local" = "#666666"
"author email domain" = "#666666"
committer = "#666666"
"committer email" = "#666666"
"committer email local" = "#666666"
"committer email domain" = "#666666"
timestamp = "#008080"
separator = "#888888"
elided = "#888888"

# Refs / bookmarks / repo state
bookmark = "#009393"
bookmarks = "#009393"
local_bookmarks = "#009393"
remote_bookmarks = "#0074b1"
tag = "#2A6500"
tags = "#2A6500"
git_ref = "#008800"
git_refs = "#008800"
git_head = { fg = "#008800", bold = true }
working_copies = "#008800"
empty = "#008800"
root = "#008800"
placeholder = { fg = "#888888", italic = true }
"description placeholder" = { fg = "#888888", italic = true }
"empty description placeholder" = { fg = "#888888", italic = true }
divergent = "#664400"
"mutable divergent" = { fg = "#8B0000", bold = true }
"mutable divergent change_id" = { fg = "#8B0000", bold = true }
conflict = { fg = "#8B0000", bold = true }
conflict_description = "#664400"
"conflict_description difficult" = "#8B0000"

# Working-copy variants
working_copy = { fg = "#000000", bold = true }
"working_copy commit_id" = { fg = "#0074b1", bold = true }
"working_copy commit_id prefix" = { fg = "#000000", bold = true }
"working_copy commit_id rest" = "#0074b1"
"working_copy commit_id shortest prefix" = { fg = "#000000", bold = true }
"working_copy commit_id shortest rest" = "#0074b1"
"working_copy change_id" = { fg = "#009393", bold = true }
"working_copy change_id prefix" = { fg = "#005F5F", bold = true }
"working_copy change_id rest" = "#009393"
"working_copy change_id shortest prefix" = { fg = "#005F5F", bold = true }
"working_copy change_id shortest rest" = "#009393"
"working_copy author" = "#666666"
"working_copy author email" = "#666666"
"working_copy author email local" = "#666666"
"working_copy author email domain" = "#666666"
"working_copy committer" = "#666666"
"working_copy timestamp" = { fg = "#008080", bold = true }
"working_copy working_copies" = { fg = "#008800", bold = true }
"working_copy bookmark" = { fg = "#009393", bold = true }
"working_copy bookmarks" = { fg = "#009393", bold = true }
"working_copy local_bookmarks" = { fg = "#009393", bold = true }
"working_copy remote_bookmarks" = { fg = "#0074b1", bold = true }
"working_copy tag" = { fg = "#2A6500", bold = true }
"working_copy tags" = { fg = "#2A6500", bold = true }
"working_copy git_ref" = { fg = "#008800", bold = true }
"working_copy git_refs" = { fg = "#008800", bold = true }
"working_copy divergent" = { fg = "#664400", bold = true }
"working_copy mutable divergent" = { fg = "#8B0000", bold = true }
"working_copy mutable divergent change_id" = { fg = "#8B0000", bold = true }
"working_copy conflict" = { fg = "#8B0000", bold = true }
"working_copy empty" = { fg = "#008800", bold = true }
"working_copy placeholder" = { fg = "#888888", bold = false, italic = true }
"working_copy description placeholder" = { fg = "#888888", bold = false, italic = true }
"working_copy empty description placeholder" = { fg = "#888888", bold = false, italic = true }

# Status / summary / diffs
"diff header" = "#664400"
"diff file_header" = { fg = "#0074b1", bold = true }
"diff hunk_header" = "#009393"
"diff context" = "#000000"
"diff context line_number" = { fg = "#888888", dim = false }
"diff added" = { fg = "#008800" }
"diff removed" = { fg = "#8B0000" }
"diff modified" = { fg = "#0074b1", bold = true }
"diff untracked" = "#009393"
"diff renamed" = "#008080"
"diff copied" = "#008800"
"diff token" = { underline = false }
"diff added token" = { fg = "#000000", bg = "#9BE7A7", underline = false }
"diff removed token" = { fg = "#000000", bg = "#F2A6A6", underline = false }
"diff modified token" = { fg = "#000000", bg = "#F2DEA0", underline = false }
"diff empty" = "#888888"
"diff binary" = "#008080"
"diff access-denied" = { fg = "#FFFFFF", bg = "#8B0000", bold = true }

# Operation log
"operation id" = "#0074b1"
"operation user" = "#666666"
"operation time" = "#008080"
"operation tags" = "#009393"
"operation current_operation" = { fg = "#000000", bold = true }
"operation current_operation id" = { fg = "#0074b1", bold = true }
"operation current_operation user" = { fg = "#666666", bold = true }
"operation current_operation time" = { fg = "#008080", bold = true }
"operation current_operation tags" = { fg = "#009393", bold = true }

# Graph nodes
"node working_copy" = { fg = "#008800", bold = true }
"node current_operation" = { fg = "#008800", bold = true }
"node immutable" = { fg = "#006A9E", bold = true }
"node conflicted" = { fg = "#8B0000", bold = true }
"node elided" = "#888888"

# Config list
"config_list name" = "#009393"
"config_list value" = "#2A6500"
"config_list source" = "#0074b1"
"config_list path" = "#008080"
"config_list overridden" = "#888888"
"config_list overridden name" = "#888888"
"config_list overridden value" = "#888888"
"config_list overridden source" = "#888888"
"config_list overridden path" = "#888888"

# Signatures
"signature display" = "#664400"
"signature key" = "#0074b1"
"signature status good" = "#008800"
"signature status unknown" = "#664400"
"signature status bad" = "#8B0000"
"signature status invalid" = "#8B0000"
