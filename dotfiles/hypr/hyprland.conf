monitor=DP-1,2560x1440@164.91,0x-340,auto

$terminal = wezterm
$fileManager = fileBrowser
$browser = zen-browser
$menu = rofi -show run

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
general {
    gaps_in = 2
    gaps_out = 0

    border_size = 2

    col.active_border = rgba(009393ff)
    col.inactive_border = rgba(000000ff)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 20
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 8
        passes = 2
    }
}
binds {
    hide_special_on_workspace_change = true
}

animations {
    enabled = true
    bezier = fluent_decel, 0, 1, 0.5, 1

    animation = windows, 1, 3, fluent_decel, slide
    animation = windowsIn, 1, 3, fluent_decel, slide
    animation = windowsOut, 1, 3, fluent_decel, slide
    animation = fade, 1, 1, default
    animation = workspaces, 1, 7, fluent_decel, slide
    animation = specialWorkspace, 1, 8, fluent_decel, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    initial_workspace_tracking = 0
}

input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    repeat_delay = 250
    repeat_rate = 60

    touchpad {
        natural_scroll = false
    }
}

workspace = 10, defaultName:Work
workspace = 11, defaultName:Discord
workspace = 12, defaultName:Steam
workspace = 13, defaultName:Alt

bind = SUPER, C, exec, $terminal

bind = SUPER, Q, killactive,
bind = SUPER, M, exit,
bind = SUPER, E, exec, $fileManager
bind = SUPER, Y, exec, $browser
bind = SUPER, V, togglefloating,
bind = SUPER, R, exec, $menu
bind = SUPER, F, fullscreen

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bind = SUPER, TAB, workspace, previous

bind = SUPER, W, workspace, 10
bind = SUPER SHIFT, W, movetoworkspace, 10
bind = SUPER, D, workspace, 11
bind = SUPER SHIFT, D, movetoworkspace, 11
bind = SUPER, S, workspace, 12
bind = SUPER SHIFT, S, movetoworkspace, 12
bind = SUPER, A, workspace, 13
bind = SUPER SHIFT, A, movetoworkspace, 13

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Hide the blank Proton/Ubisoft helper window (don’t move to special workspace)
windowrule = match:initial_class ^steam_app_2225070$, match:initial_title ^$, match:xwayland true, match:float true, opacity 0.0 override, no_focus on, no_anim on, decorate off, size 1 1, move -10000 -10000

exec-once = hyprpaper
exec-once = bash -c "sleep 0.3 && ~/.config/hypr/set-random-wall.sh &> /dev/null &"
exec-once = waybar
exec-once = bluetoothctl power on
exec-once = blueman-applet

bind = SUPER SHIFT, F, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%F_%T).png && \
                          wl-copy < ~/Pictures/Screenshots/$(date +%F_%T).png && \
                          notify-send "Region shot saved & copied"
