set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:cstyle'
set -ag terminal-overrides ",xterm-256color:RGB,*:Ss=\\E[%p1%d q:Se=\\E[2 q,*:Smulx=\\E[4::%p1%dm,*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set -ag update-environment " WAYLAND_DISPLAY DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS NIRI_SOCKET XDG_CURRENT_DESKTOP"

# Better split shortcuts
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Prefix
unbind C-b
set -g prefix M-a
bind M-a send-prefix

bind s choose-tree -Zs
bind -n M-t run-shell -C 'new-window -c "#{@root_path}"'
bind -n M-T new-session
bind -n M-R run-shell -C 'set-option -t "#{session_id}" @root_path "#{pane_current_path}"; display-message "session root: #{pane_current_path}"'
bind -n M-s choose-tree -Zs

set-option -g status-position top

setw -g mode-keys vi
bind -n M-w copy-mode
bind -n M-d copy-mode \; send-keys Space
bind v copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@tmux-clipboard-command}"

bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' \
  'send-keys -X clear-selection' \
  'send-keys -X cancel'

bind-key -T copy-mode-vi 'V' send-keys -X select-line
bind-key -T copy-mode-vi 'C-v' \
  if-shell -F '#{selection_present}' \
  'send-keys -X rectangle-toggle' \
  'send-keys -X begin-selection; send-keys -X rectangle-toggle'

bind-key -T copy-mode-vi '§' send-keys -X back-to-indentation
bind-key -T copy-mode-vi ';' send-keys -X jump-reverse
bind-key -T copy-mode-vi ',' send-keys -X jump-again

bind-key -T copy-mode-vi C-Left  send-keys -X previous-word
bind-key -T copy-mode-vi C-Right send-keys -X next-word-end
bind-key -T copy-mode-vi C-Up    send-keys -X -N 3 cursor-up
bind-key -T copy-mode-vi C-Down  send-keys -X -N 3 cursor-down
bind-key -T copy-mode-vi S-Up    send-keys -X -N 10 cursor-up
bind-key -T copy-mode-vi S-Down  send-keys -X -N 10 cursor-down

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-h switch-client -p
bind-key -n M-l switch-client -n

set -g window-status-separator ""
set -g @current-window-in-mode "#{m/r:[1-9],#{W:#{?window_active,#{P:#{pane_in_mode}},}}}"
set -g cursor-style block
set-hook -g pane-mode-changed {
  run-shell -b 'if tmux -S "#{socket_path}" display-message -p -t "#{hook_pane}" "##{m/r:[1-9],##{P:##{pane_in_mode}}}" | grep -q 1; then tmux -S "#{socket_path}" set -w -t "#{hook_pane}" cursor-colour "#{@copy-mode-cursor}"; else tmux -S "#{socket_path}" set -w -u -t "#{hook_pane}" cursor-colour; fi; tmux -S "#{socket_path}" refresh-client -S'
}
source-file "~/.config/theme/current/tmux.conf"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "

set -g status-left " #S "
set -g status-right ""
set -g status-left-length 1000
