include ${HOME}/.config/theme/current/kitty.conf
background_opacity 1.00
dynamic_background_opacity yes
font_family IosevkaTermSlab Nerd Font Mono
font_size 20
clipboard_control write-clipboard write-primary read-clipboard read-primary
confirm_os_window_close 0
hide_window_decorations titlebar-only
enable_audio_bell no

macos_option_as_alt left

text_composition_strategy legacy

cursor_trail 1
cursor_trail_decay 0.01 0.5

# BEGIN_KITTY_FONTS
#font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
#bold_font        family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-ExtraBold
#italic_font      family='JetBrainsMono Nerd Font Mono' style='SemiBold Italic'
#bold_italic_font family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-ExtraBoldItalic
# END_KITTY_FONTS
