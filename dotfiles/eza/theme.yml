colourful: true

filekinds:
  normal: {foreground: "#000000"}
  directory: {foreground: "#009393", is_bold: true}
  symlink: {foreground: "#0074b1"}
  pipe: {foreground: "#888888"}
  block_device: {foreground: "#008080", is_bold: true}
  char_device: {foreground: "#008080", is_bold: true}
  socket: {foreground: "#0074b1", is_bold: true}
  special: {foreground: "#008080"}
  executable: {foreground: "#008800", is_bold: true}
  mount_point: {foreground: "#009393", is_bold: true, is_underline: true}

perms:
  user_read: {foreground: "#2A6500", is_bold: true}
  user_write: {foreground: "#0074b1", is_bold: true}
  user_execute_file: {foreground: "#008800", is_bold: true, is_underline: true}
  user_execute_other: {foreground: "#008800", is_bold: true}
  group_read: {foreground: "#2A6500"}
  group_write: {foreground: "#0074b1"}
  group_execute: {foreground: "#008800"}
  other_read: {foreground: "#888888"}
  other_write: {foreground: "#0074b1"}
  other_execute: {foreground: "#008800"}
  special_user_file: {foreground: "#0074b1"}
  special_other: {foreground: "#888888"}
  attribute: {foreground: "#888888"}

size:
  major: {foreground: "#008800", is_bold: true}
  minor: {foreground: "#008800"}
  number_byte: {foreground: "#000000", is_bold: true}
  number_kilo: {foreground: "#008800", is_bold: true}
  number_mega: {foreground: "#009393", is_bold: true}
  number_giga: {foreground: "#0074b1", is_bold: true}
  number_huge: {foreground: "#0074b1", is_bold: true}
  unit_byte: {foreground: "#888888"}
  unit_kilo: {foreground: "#008800"}
  unit_mega: {foreground: "#009393"}
  unit_giga: {foreground: "#0074b1"}
  unit_huge: {foreground: "#0074b1"}

users:
  user_you: {foreground: "#000000", is_bold: true}
  user_root: {foreground: "#0074b1"}
  user_other: {foreground: "#000000"}
  group_yours: {foreground: "#000000", is_bold: true}
  group_other: {foreground: "#888888"}
  group_root: {foreground: "#0074b1"}

links:
  normal: {foreground: "#0074b1", is_bold: true}
  multi_link_file: {foreground: "#008080"}

git:
  new: {foreground: "#008800"}
  modified: {foreground: "#0074b1"}
  deleted: {foreground: "#0074b1"}
  renamed: {foreground: "#009393"}
  typechange: {foreground: "#008080"}
  ignored: {foreground: "#888888", is_dimmed: true}
  conflicted: {foreground: "#0074b1", is_bold: true}

git_repo:
  branch_main: {foreground: "#000000"}
  branch_other: {foreground: "#0074b1"}
  git_clean: {foreground: "#008800"}
  git_dirty: {foreground: "#0074b1"}

security_context:
  colon: {foreground: "#888888", is_dimmed: true}
  user: {foreground: "#009393"}
  role: {foreground: "#008800"}
  typ: {foreground: "#008080"}
  range: {foreground: "#0074b1"}

file_type:
  image: {foreground: "#0074b1"}
  video: {foreground: "#0074b1", is_bold: true}
  music: {foreground: "#008800"}
  lossless: {foreground: "#2A6500", is_bold: true}
  crypto: {foreground: "#008800", is_bold: true}
  document: {foreground: "#008080"}
  compressed: {foreground: "#0074b1"}
  temp: {foreground: "#888888"}
  compiled: {foreground: "#008080"}
  build: {foreground: "#009393", is_bold: true, is_underline: true}
  source: {foreground: "#0074b1"}

punctuation: {foreground: "#888888", is_bold: true}
date: {foreground: "#888888"}
inode: {foreground: "#0074b1"}
blocks: {foreground: "#009393"}
header: {foreground: "#000000", is_underline: true}
octal: {foreground: "#008080"}
flags: {foreground: "#008080"}

symlink_path: {foreground: "#0074b1"}
control_char: {foreground: "#0074b1"}
broken_symlink: {foreground: "#0074b1", is_bold: true}
broken_path_overlay: {foreground: "#888888", is_underline: true}
